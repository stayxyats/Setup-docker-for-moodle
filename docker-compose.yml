services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: moodle
      POSTGRES_PASSWORD: moodle
      POSTGRES_DB: moodle
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    image: moodlehq/moodle-php-apache:8.3
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./moodle:/var/www/html
      - moodledata:/var/www/moodledata

volumes:
  db_data:
  moodledata:
